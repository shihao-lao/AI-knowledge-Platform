services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-ai-agent-app
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: mysql+aiomysql://root:root@mysql:3306/ai_knowledge_platform
      # 必须提供至少 32 字节的随机密钥，示例值会被应用启动时拒绝
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 必须设置为至少 32 字节的随机密钥}
      MILVUS_HOST: milvus
      MILVUS_PORT: '19530'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      MIMO_MODEL: ${MIMO_MODEL:-mimo-v2.5}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: enterprise-ai-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_knowledge_platform
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # 宿主机映射到 3307，避免与本地已有的 3306 实例冲突；容器间仍走 3306
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  etcd:
    image: bitnami/etcd:3.5.5
    container_name: enterprise-ai-agent-etcd
    environment:
      ALLOW_NONE_AUTHENTICATION: 'yes'
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    volumes:
      - etcd_data:/bitnami/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: enterprise-ai-agent-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/minio_data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: enterprise-ai-agent-milvus
    command: ['milvus', 'run', 'standalone']
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - '19530:19530'
      - '9091:9091'
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
