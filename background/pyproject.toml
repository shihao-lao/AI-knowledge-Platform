[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-agent"
version = "0.1.0"
description = "AI 面试知识库后端服务（FastAPI + LangChain + RAG）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "rag", "fastapi", "langchain", "interview"]

# 依赖只有一份来源：requirements.txt。
# 此前这里又抄了一遍依赖列表（且版本范围与 requirements.txt 不一致），
# 两处会各自漂移，因此改为动态读取，避免出现第二个真相来源。
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
